name: "🤖 Antigravity CorsairDash Modder Dispatch"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Natural-language modding, ship tier, loadout balance, boss monster, or audit task for CorsairDash"
        required: true
        default: "Audit all CorsairDash instances (Prod & Dev), 6 ship tiers, 8 loadout modules, 12 island ports, 4 boss monsters, and 3 difficulty escalation curves."
        type: string
      mode:
        description: "Output delivery mode"
        required: true
        default: "report-issue"
        type: choice
        options:
          - report-issue
          - summary-only
      target_instance:
        description: "Target CorsairDash instance (dev, prod, all)"
        required: false
        default: "dev"
        type: choice
        options:
          - dev
          - prod
          - all
      mod_category:
        description: "Optional modding subsystem focus"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ships-and-loadouts
          - pirates-and-difficulty
          - boss-monsters
          - islands-and-map
          - sea-shanties

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  run-modder-agent:
    name: "Execute Autonomous CorsairDash Modder Task"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Antigravity CorsairDash CI Modder Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agents/ci_runner.py \
            --event dispatch \
            --task "${{ inputs.task }}" \
            --mode "${{ inputs.mode }}" \
            --instance "${{ inputs.target_instance }}" \
            --category "${{ inputs.mod_category }}"
